<body>
<div class="reader">
<header class="toolbar">
  <div class="book-head"><button id="back" class="back" type="button">‹</button><div class="book-text"><div id="title" class="book-title"></div><div id="sub" class="book-sub"></div></div></div>
  <div id="controls" class="controls"></div>
  <div class="reader-status"><span id="status" class="status"></span><span id="pct" class="pct">0%</span></div>
  <div class="progress-line"><span id="bar"></span></div>
</header>
<main class="stage">
  <div id="loading" class="loading"><span class="spinner"></span><span id="loadTitle">正在打开电子书…</span><span id="loadDetail" class="detail"></span></div>
  <section id="pdfShell" class="pdf-shell" hidden><div id="pdfPages" class="pdf-pages"></div></section>
  <section id="epubShell" class="epub-shell" hidden><iframe id="epubFrame" class="epub-frame" referrerpolicy="no-referrer"></iframe></section>
  <section id="textShell" class="text-shell" hidden><article class="text-page"><pre id="textContent" class="text-content"></pre></article></section>
  <aside id="toc" class="toc"><div class="toc-head"><span>目录</span><button id="tocClose" class="toolbtn">×</button></div><div id="tocList" class="toc-list"></div></aside>
  <div id="noteOverlay" class="note-overlay" aria-hidden="true"><section class="note-card" role="dialog" aria-modal="true" aria-labelledby="noteTitle"><div class="note-head"><div id="noteTitle" class="note-title">注释</div><button id="noteClose" class="note-close" type="button" aria-label="关闭注释">×</button></div><div id="noteContent" class="note-content"></div><div class="note-hint">Esc / 点击空白处关闭</div></section></div>
  <div id="capturePicker" class="capture-picker" hidden><section class="capture-card"><div class="capture-head"><div><strong>保存截图到 Note</strong><small id="captureMeta"></small></div><button id="captureClose" class="capture-close" type="button">×</button></div><div class="capture-body"><input id="captureSearch" class="capture-search" placeholder="搜索已有笔记…"><button id="captureNew" class="capture-new active" type="button"><span>＋</span><span><strong>新建笔记</strong><small>以当前书籍和页码创建一篇新笔记</small></span></button><input id="captureTitle" class="capture-title-input" placeholder="新笔记标题"><div id="captureList" class="capture-list"><div class="capture-empty">正在读取笔记…</div></div></div><div class="capture-foot"><div id="captureFootNote" class="capture-foot-note">截图会保存到 Note 的 uploads，并记录书籍 SHA-256 与页码。</div><div class="capture-actions"><button id="captureCancel" class="toolbtn" type="button">取消</button><button id="captureSave" class="toolbtn capture-save" type="button">写入笔记</button></div></div></section></div>
  <div id="excerptPicker" class="capture-picker" hidden><section class="capture-card"><div class="capture-head"><div><strong>保存摘录到 Note</strong><small id="excerptMeta"></small></div><button id="excerptClose" class="capture-close" type="button">×</button></div><div class="capture-body"><input id="excerptSearch" class="capture-search" placeholder="搜索已有笔记…"><button id="excerptNew" class="capture-new active" type="button"><span>＋</span><span><strong>新建笔记</strong><small>以当前划线内容创建一篇新笔记</small></span></button><input id="excerptTitle" class="capture-title-input" placeholder="新笔记标题"><div id="excerptList" class="capture-list"><div class="capture-empty">正在读取笔记…</div></div></div><div class="capture-foot"><div id="excerptFootNote" class="capture-foot-note">摘录会保留书籍身份与原文位置，可从 Note 一键返回。</div><div class="capture-actions"><button id="excerptCancel" class="toolbtn" type="button">取消</button><button id="excerptSave" class="toolbtn capture-save" type="button">写入笔记</button></div></div></section></div>
  <div id="textSelectionTools" class="text-selection-tools" hidden><button id="selectionMark" class="toolbtn" type="button">划线</button><button id="selectionShare" class="toolbtn" type="button">摘到笔记</button></div>
  <div id="readerToast" class="reader-toast"></div>
  
</main>
</div>
<script>
const BOOT=JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(atob('__BOOT_B64__'),c=>c.charCodeAt(0))));
const $=id=>document.getElementById(id),controls=$('controls'),loading=$('loading'),loadTitle=$('loadTitle'),loadDetail=$('loadDetail'),statusEl=$('status'),pctEl=$('pct'),bar=$('bar');
$('title').textContent=BOOT.title||'未命名书籍';$('sub').textContent=[BOOT.author,BOOT.relative_path].filter(Boolean).join(' · ');
let state={progress:Number(BOOT.progress&&BOOT.progress.progress||0),locator:String(BOOT.progress&&BOOT.progress.locator||''),page:BOOT.progress&&BOOT.progress.page||null,total_pages:BOOT.progress&&BOOT.progress.total_pages||null};
let dirty=false,saveTimer=null,lastActivity=Date.now(),saveChain=Promise.resolve();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),percent=v=>Math.round(clamp(Number(v||0),0,1)*100);
function ui(p,label){p=clamp(Number(p||0),0,1);pctEl.textContent=percent(p)+'%';bar.style.width=(p*100).toFixed(2)+'%';if(label!=null)statusEl.textContent=label}
const textSelectionTools=$('textSelectionTools'),selectionMark=$('selectionMark'),selectionShare=$('selectionShare'),excerptPicker=$('excerptPicker'),excerptList=$('excerptList'),excerptSearch=$('excerptSearch'),excerptNew=$('excerptNew'),excerptTitle=$('excerptTitle'),excerptMeta=$('excerptMeta'),excerptSave=$('excerptSave'),excerptFootNote=$('excerptFootNote'),readerToastGlobal=$('readerToast');
let activeTextSelection=null,pendingExcerpt=null,excerptNotes=[],selectedExcerptNoteId='',readerToastGlobalTimer=null;
const LAST_NOTE_TARGET_KEY='shufang:last-note-target';
function getLastNoteTargetId(){try{return String(localStorage.getItem(LAST_NOTE_TARGET_KEY)||'')}catch{return ''}}
function rememberLastNoteTargetId(id){const value=String(id||'').trim();try{if(value)localStorage.setItem(LAST_NOTE_TARGET_KEY,value);else localStorage.removeItem(LAST_NOTE_TARGET_KEY)}catch{}return value}
function selectRememberedExcerptTarget(){const remembered=getLastNoteTargetId();if(remembered&&excerptNotes.some(n=>n.id===remembered)){setExcerptSelection(remembered);return}if(remembered)rememberLastNoteTargetId('');setExcerptSelection('')}
function readerMessage(text){readerToastGlobal.textContent=String(text||'');readerToastGlobal.classList.add('show');clearTimeout(readerToastGlobalTimer);readerToastGlobalTimer=setTimeout(()=>readerToastGlobal.classList.remove('show'),2200)}
function hideTextSelectionTools(){textSelectionTools.hidden=true;activeTextSelection=null}
function showTextSelectionTools(rect,payload){if(!rect||!payload)return;activeTextSelection=payload;selectionMark.textContent=payload.annotation?'取消划线':'划线';selectionShare.textContent='摘到笔记';const x=clamp(rect.left+rect.width/2,86,window.innerWidth-86),y=Math.max(66,rect.top-8);textSelectionTools.style.left=x+'px';textSelectionTools.style.top=y+'px';textSelectionTools.hidden=false}
selectionMark.addEventListener('pointerdown',e=>e.preventDefault());selectionShare.addEventListener('pointerdown',e=>e.preventDefault());
async function fetchReaderAnnotations(format,scope){const params=new URLSearchParams({format:String(format||'')});if(scope!=null)params.set('scope',String(scope||''));const r=await fetch('/api/annotations/'+encodeURIComponent(BOOT.hash)+'?'+params.toString(),{cache:'no-store'});const data=await r.json().catch(()=>[]);if(!r.ok)throw new Error(data.error||'读取划线失败');return Array.isArray(data)?data:[]}
async function addReaderAnnotation(payload){const r=await fetch('/api/annotations/'+encodeURIComponent(BOOT.hash),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:payload.format,scope:payload.scope||'',start:payload.start,end:payload.end,quote:payload.text,progress:payload.progress||0})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'保存划线失败');return data}
async function removeReaderAnnotation(id){const r=await fetch('/api/annotations/'+encodeURIComponent(BOOT.hash)+'/'+encodeURIComponent(id),{method:'DELETE'});if(!r.ok&&r.status!==404)throw new Error('取消划线失败')}
function excerptLocationLabel(payload){if(payload.format==='epub'){const n=Math.max(1,Number(payload.chapterIndex||0)+1),t=Math.max(0,Number(payload.chapterTotal||0));return t?('第 '+n+' / '+t+' 章'):('第 '+n+' 章')}return '文本 '+Math.round(clamp(Number(payload.progress||0),0,1)*100)+'%'}
function setExcerptSelection(id){selectedExcerptNoteId=String(id||'');excerptNew.classList.toggle('active',!selectedExcerptNoteId);excerptList.querySelectorAll('.capture-note').forEach(b=>b.classList.toggle('active',b.dataset.id===selectedExcerptNoteId));excerptTitle.disabled=!!selectedExcerptNoteId}

 if(reader){while(true){const part=await reader.read();if(part.done)break;chunks.push(part.value);loaded+=part.value.byteLength;loadDetail.textContent=total?('正在读取 '+Math.round(loaded/total*100)+'%'):('已读取 '+(loaded/1048576).toFixed(1)+' MB')}}else{const b=new Uint8Array(await r.arrayBuffer());chunks.push(b);loaded=b.length}clearTimeout(timeout);const bytes=new Uint8Array(loaded);let off=0;for(const c of chunks){bytes.set(c,off);off+=c.byteLength}
 let text='';if(bytes.length>=3&&bytes[0]===239&&bytes[1]===187&&bytes[2]===191)text=new TextDecoder('utf-8').decode(bytes.subarray(3));else if(bytes.length>=2&&bytes[0]===255&&bytes[1]===254)text=new TextDecoder('utf-16le').decode(bytes.subarray(2));else{try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{try{text=new TextDecoder('gb18030').decode(bytes)}catch{text=new TextDecoder().decode(bytes)}}}const rawText=text.replace(/\r\n?/g,'\n');
 let annotations=[];try{annotations=await fetchReaderAnnotations(format,'text')}catch{annotations=[]}
 let theme=localStorage.getItem('shufang-text-theme')||'paper',font=clamp(Number(localStorage.getItem('shufang-text-font')||100),75,180),timer=null;
 function apply(){shell.classList.toggle('dark',theme==='dark');shell.classList.toggle('light',theme==='light');content.style.fontSize=(17*font/100).toFixed(1)+'px';$('theme').value=theme;$('fontLabel').textContent=font+'%';localStorage.setItem('shufang-text-theme',theme);localStorage.setItem('shufang-text-font',String(font))}
 function renderMarks(){const y=shell.scrollTop,frag=document.createDocumentFragment(),rows=(annotations||[]).map(a=>({...a,start:Math.max(0,Number(a.start)||0),end:Math.min(rawText.length,Number(a.end)||0)})).filter(a=>a.end>a.start).sort((a,b)=>a.start-b.start);let cursor=0;for(const ann of rows){if(ann.start<cursor)continue;if(ann.start>cursor)frag.appendChild(document.createTextNode(rawText.slice(cursor,ann.start)));const span=document.createElement('span');span.className='reader-annotation';span.dataset.annotationId=ann.id;span.dataset.start=String(ann.start);span.dataset.end=String(ann.end);span.textContent=rawText.slice(ann.start,ann.end);frag.appendChild(span);cursor=ann.end}if(cursor<rawText.length)frag.appendChild(document.createTextNode(rawText.slice(cursor)));content.replaceChildren(frag);shell.scrollTop=y}
 function selectionOffsets(range){try{const a=document.createRange();a.selectNodeContents(content);a.setEnd(range.startContainer,range.startOffset);const b=document.createRange();b.selectNodeContents(content);b.setEnd(range.endContainer,range.endOffset);const start=a.toString().length,end=b.toString().length;return end>start?{start,end}:null}catch{return null}}
 function textRangeForOffsets(start,end){start=Math.max(0,Math.floor(Number(start)||0));end=Math.max(start+1,Math.floor(Number(end)||start+1));const walker=document.createTreeWalker(content,NodeFilter.SHOW_TEXT);let node,pos=0,startNode=null,startOffset=0,endNode=null,endOffset=0;while((node=walker.nextNode())){const len=node.nodeValue.length,next=pos+len;if(startNode===null&&start>=pos&&start<=next){startNode=node;startOffset=Math.min(len,Math.max(0,start-pos))}if(endNode===null&&end>=pos&&end<=next){endNode=node;endOffset=Math.min(len,Math.max(0,end-pos));break}pos=next}if(!startNode)return null;if(!endNode){endNode=startNode;endOffset=startNode.nodeValue.length}try{const range=document.createRange();range.setStart(startNode,startOffset);range.setEnd(endNode,Math.max(endNode===startNode?startOffset+1:0,endOffset));return range}catch{return null}}
 function scrollTextRange(range){if(!range)return false;try{const rect=range.getBoundingClientRect(),host=shell.getBoundingClientRect();shell.scrollTop=Math.max(0,shell.scrollTop+rect.top-host.top-shell.clientHeight*.32);return true}catch{return false}}
 async function refreshAnnotations(){const y=shell.scrollTop;annotations=await fetchReaderAnnotations(format,'text');renderMarks();shell.scrollTop=y}
 function inspectSelection(){const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const range=sel.getRangeAt(0);if(!content.contains(range.commonAncestorContainer))return;const selected=String(sel.toString()||'').trim();if(!selected||selected.length>20000)return;const offsets=selectionOffsets(range);if(!offsets)return;const progress=rawText.length?clamp(offsets.start/rawText.length,0,1):0;showTextSelectionTools(range.getBoundingClientRect(),{format,scope:'text',start:offsets.start,end:offsets.end,text:selected,progress,chapterIndex:0,chapterTotal:0,chapterTitle:'',onChanged:refreshAnnotations})}
 function showAnnotation(mark){const ann=annotations.find(a=>a.id===mark.dataset.annotationId);if(!ann)return;showTextSelectionTools(mark.getBoundingClientRect(),{annotation:ann,format,scope:'text',start:Number(ann.start),end:Number(ann.end),text:String(ann.quote||''),progress:rawText.length?clamp(Number(ann.start)/rawText.length,0,1):0,chapterIndex:0,chapterTotal:0,chapterTitle:'',onChanged:refreshAnnotations})}
 function record(){const max=Math.max(1,shell.scrollHeight-shell.clientHeight),p=clamp(shell.scrollTop/max,0,1);setProgress({progress:p,locator:'scroll:'+Math.round(shell.scrollTop),page:null,total_pages:null},'文本 '+percent(p)+'%')}
 renderMarks();apply();requestAnimationFrame(()=>{let jumped=false;if(BOOT.source_jump&&Number(BOOT.open_start)>=0){const mark=[...content.querySelectorAll('.reader-annotation')].find(x=>Number(x.dataset.start)===Number(BOOT.open_start)&&Number(x.dataset.end)===Number(BOOT.open_end));if(mark){mark.classList.add('source-jump');mark.scrollIntoView({block:'center'});setTimeout(()=>mark.classList.remove('source-jump'),7000);jumped=true}else{jumped=scrollTextRange(textRangeForOffsets(BOOT.open_start,BOOT.open_end))}}if(!jumped){const max=Math.max(0,shell.scrollHeight-shell.clientHeight),m=String(state.locator||'').match(/^scroll:(\d+)$/),jumpProgress=BOOT.source_jump&&Number(BOOT.open_progress)>=0?clamp(Number(BOOT.open_progress),0,1):null;shell.scrollTop=jumpProgress!=null?jumpProgress*max:(m?clamp(Number(m[1]),0,max):state.progress*max)}record();doneLoading()});
 shell.addEventListener('scroll',()=>{hideTextSelectionTools();clearTimeout(timer);timer=setTimeout(record,160)},{passive:true});content.addEventListener('mouseup',()=>setTimeout(inspectSelection,0));content.addEventListener('keyup',e=>{if(e.key==='Shift'||e.shiftKey)setTimeout(inspectSelection,0)});content.addEventListener('click',e=>{const mark=e.target.closest('.reader-annotation');if(mark){e.preventDefault();showAnnotation(mark)}});$('top').onclick=()=>shell.scrollTo({top:0,behavior:'smooth'});$('down').onclick=()=>shell.scrollBy({top:shell.clientHeight*.88,behavior:'smooth'});$('fontDown').onclick=()=>{font=clamp(font-10,75,180);apply()};$('fontUp').onclick=()=>{font=clamp(font+10,75,180);apply()};$('theme').onchange=e=>{theme=e.target.value;apply()}
}

(async()=>{try{if(BOOT.ext==='.pdf')await initPdf();else if(BOOT.ext==='.epub')await initEpub();else if(BOOT.ext==='.txt'||BOOT.ext==='.md')await initText();else doneLoading()}catch(e){fail(e)}})();
