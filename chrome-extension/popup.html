<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Note 网页摘录</title><link rel="stylesheet" href="popup.css"></head><body>
<main>
  <header><div><h1>Note</h1><p>网页摘录</p></div><span id="statusDot"></span></header>
  <div id="status">检查 Note…</div>
  <button id="clipText" class="primary">摘录选中文字</button>
  <button id="capture">框选截图</button>
  <button id="compat" class="compat">兼容选文：关</button><div class="hint">遇到禁止选中/右键的网站：开启后重新拖选文字，再按 Ctrl+Shift+Y。</div>
  <button id="openNote" class="quiet">打开 Note</button>
  <details><summary>连接设置</summary><input id="noteBase" spellcheck="false"><button id="saveBase" class="small">保存地址</button></details>
  <footer id="shortcutStatus">检查快捷键…</footer>
</main><script src="popup.js"></script></body></html>
